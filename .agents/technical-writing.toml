version = 1
mode = "strict"

[limits]
instruction_words = 20
descriptive_words = 25
paragraph_sentences = 6
max_warnings_per_100_words = 0

[rules]
long_sentence = "error"
semicolon = "error"
contraction = "error"
passive_voice = "error"
complex_verb = "error"
ing_main_verb = "error"
nominalization = "error"
phrasal_verb = "error"
banned_word = "error"
marketing_adjective = "error"
modal_hedge = "error"
formulaic_phrase = "error"
negative_parallelism = "error"
assistant_scaffold = "error"
restricted_vocabulary = "error"
long_paragraph = "error"
em_dash = "error"
glossary_term = "error"

[files]
exclude = []
exceptions = ["CHANGELOG.md"]

[terms]
additional_banned = []
allowed = []

[restricted_vocabulary]
additional = []
exceptions = []

[glossary]
path = "GLOSSARY.md"
required = true
require_approved_definitions = true
candidate_min_occurrences = 2
ignored_candidates = [
  "Adder",
  "analyzer-ident",
  "ArtifactLocation",
  "AssignStmt",
  "BlockStmt",
  "Box",
  "BuildAnalyzers",
  "CHANGELOG",
